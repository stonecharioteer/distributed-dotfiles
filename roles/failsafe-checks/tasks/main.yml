---
# Comprehensive failsafe checks to prevent destructive operations

# Set default variables for compatibility
- name: Set default variables
  set_fact:
    qtile_venv_path: "{{ qtile_venv_path | default('/opt/qtile') }}"
    run_gui_failsafe_checks: "{{ run_gui_failsafe_checks | default(false) | bool }}"

# ---------------------------------------------------------------------------
# Helpers: normalize git remotes so HTTPS/SSH/.git variants all match.
# Accepts github.com[:/]owner/repo with optional .git and trailing slash.
# ---------------------------------------------------------------------------
- name: Define git remote matcher helpers
  set_fact:
    git_remote_match_qtile: 'github\.com[:/]+stonecharioteer/dotfiles-qtile(\.git)?/?$'
    git_remote_match_alacritty: 'github\.com[:/]+alacritty/alacritty(\.git)?/?$'
    git_remote_match_scripts: 'github\.com[:/]+stonecharioteer/scripts(\.git)?/?$'
    git_remote_match_fish: 'github\.com[:/]+stonecharioteer/dotfiles-fish(\.git)?/?$'

- name: Check if qtile config directory exists
  stat:
    path: "{{ dev_home }}/.config/qtile"
  register: qtile_config_exists
  when: run_gui_failsafe_checks

- name: Check if existing qtile directory is a git repository
  stat:
    path: "{{ dev_home }}/.config/qtile/.git"
  register: qtile_is_git_repo
  when:
    - run_gui_failsafe_checks
    - qtile_config_exists.stat.exists | default(false)

- name: Get git remote URL if it's a git repository
  shell: |
    set -o pipefail
    git -C "{{ dev_home }}/.config/qtile" remote get-url origin 2>/dev/null || echo "no-remote"
  args:
    executable: /bin/bash
  register: qtile_git_remote
  become: true
  become_user: "{{ dev_user }}"
  when:
    - run_gui_failsafe_checks
    - qtile_config_exists.stat.exists | default(false)
    - qtile_is_git_repo.stat.exists | default(false)
  changed_when: false
  failed_when: false

- name: Normalize qtile git remote
  set_fact:
    qtile_git_remote_url: "{{ qtile_git_remote.stdout | default('no-remote') | trim }}"
  when:
    - run_gui_failsafe_checks
    - qtile_config_exists.stat.exists | default(false)
    - qtile_is_git_repo.stat.exists | default(false)

- name: Get current git branch if it's a git repository
  shell: |
    set -o pipefail
    git -C "{{ dev_home }}/.config/qtile" branch --show-current 2>/dev/null || echo "unknown"
  args:
    executable: /bin/bash
  register: qtile_git_branch
  become: true
  become_user: "{{ dev_user }}"
  when:
    - run_gui_failsafe_checks
    - qtile_config_exists.stat.exists | default(false)
    - qtile_is_git_repo.stat.exists | default(false)
  changed_when: false
  failed_when: false

- name: Check if /opt/qtile directory exists
  stat:
    path: "{{ qtile_venv_path }}"
  register: qtile_venv_exists
  when: run_gui_failsafe_checks

- name: Check if /opt/qtile is a valid Python virtual environment
  stat:
    path: "{{ qtile_venv_path }}/bin/python"
  register: qtile_venv_valid
  when:
    - run_gui_failsafe_checks
    - qtile_venv_exists.stat.exists | default(false)

- name: Check if qtile is already installed in venv
  shell: |
    set -o pipefail
    "{{ qtile_venv_path }}/bin/python" -c "import qtile; print('installed')" 2>/dev/null || echo "not-installed"
  args:
    executable: /bin/bash
  register: qtile_installed_check
  when:
    - run_gui_failsafe_checks
    - qtile_venv_exists.stat.exists | default(false)
    - qtile_venv_valid.stat.exists | default(false)
  changed_when: false
  failed_when: false

- name: Check if Alacritty source directory exists
  stat:
    path: "{{ dev_home }}/code/tools/alacritty"
  register: alacritty_source_exists
  when: run_gui_failsafe_checks

- name: Check if Alacritty directory is a git repository
  stat:
    path: "{{ dev_home }}/code/tools/alacritty/.git"
  register: alacritty_is_git_repo
  when:
    - run_gui_failsafe_checks
    - alacritty_source_exists.stat.exists | default(false)

- name: Get Alacritty git remote URL
  shell: |
    set -o pipefail
    git -C "{{ dev_home }}/code/tools/alacritty" remote get-url origin 2>/dev/null || echo "no-remote"
  args:
    executable: /bin/bash
  register: alacritty_git_remote
  become: true
  become_user: "{{ dev_user }}"
  when:
    - run_gui_failsafe_checks
    - alacritty_source_exists.stat.exists | default(false)
    - alacritty_is_git_repo.stat.exists | default(false)
  changed_when: false
  failed_when: false

- name: Normalize Alacritty git remote
  set_fact:
    alacritty_git_remote_url: "{{ alacritty_git_remote.stdout | default('no-remote') | trim }}"
  when:
    - run_gui_failsafe_checks
    - alacritty_source_exists.stat.exists | default(false)
    - alacritty_is_git_repo.stat.exists | default(false)

- name: Check if Alacritty binary is already installed
  stat:
    path: /usr/local/bin/alacritty
  register: alacritty_binary_exists
  when: run_gui_failsafe_checks

- name: Display current state summary
  debug:
    msg: |
      === CURRENT SYSTEM STATE ===
      Qtile config directory: {{ 'EXISTS' if qtile_config_exists.stat.exists | default(false) else 'NOT FOUND' }}
      {% if qtile_config_exists.stat.exists | default(false) %}
      Qtile is git repo: {{ 'YES' if qtile_is_git_repo.stat.exists | default(false) else 'NO' }}
      {% if qtile_is_git_repo.stat.exists | default(false) %}
      Git remote: {{ qtile_git_remote_url | default(qtile_git_remote.stdout | default('')) }}
      Current branch: {{ qtile_git_branch.stdout | default('unknown') }}
      {% endif %}
      {% endif %}
      /opt/qtile venv: {{ 'EXISTS' if qtile_venv_exists.stat.exists | default(false) else 'NOT FOUND' }}
      {% if qtile_venv_exists.stat.exists | default(false) %}
      Valid Python venv: {{ 'YES' if qtile_venv_valid.stat.exists | default(false) else 'NO' }}
      {% if qtile_venv_valid.stat.exists | default(false) %}
      Qtile installed: {{ qtile_installed_check.stdout | default('unknown') }}
      {% endif %}
      {% endif %}
      Alacritty source: {{ 'EXISTS' if alacritty_source_exists.stat.exists | default(false) else 'NOT FOUND' }}
      {% if alacritty_source_exists.stat.exists | default(false) %}
      Alacritty is git repo: {{ 'YES' if alacritty_is_git_repo.stat.exists | default(false) else 'NO' }}
      {% if alacritty_is_git_repo.stat.exists | default(false) %}
      Alacritty remote: {{ alacritty_git_remote_url | default(alacritty_git_remote.stdout | default('')) }}
      {% endif %}
      {% endif %}
      Alacritty binary: {{ 'INSTALLED' if alacritty_binary_exists.stat.exists | default(false) else 'NOT FOUND' }}
  when: run_gui_failsafe_checks

# FAILSAFE: Stop if qtile config exists but is not the correct repository
- name: FAILSAFE - Stop if qtile config directory exists but is not our repository
  fail:
    msg: |
      STOP: ~/.config/qtile exists but is not a git repository.
      This could be a different qtile configuration. Please backup or remove it manually.
      Found at: {{ dev_home }}/.config/qtile
  when:
    - run_gui_failsafe_checks
    - qtile_config_exists.stat.exists | default(false)
    - not (qtile_is_git_repo.stat.exists | default(false))

- name: FAILSAFE - Stop if qtile config is a different git repository
  fail:
    msg: |
      STOP: ~/.config/qtile is a git repository but not the expected one.
      Expected repository: stonecharioteer/dotfiles-qtile via HTTPS or SSH
      Found: {{ qtile_git_remote_url | default('') }}
      Please backup or remove it manually, or update the remote URL.
  when:
    - run_gui_failsafe_checks
    - qtile_config_exists.stat.exists | default(false)
    - qtile_is_git_repo.stat.exists | default(false)
    - not (qtile_git_remote_url | default('') is regex(git_remote_match_qtile))

# FAILSAFE: Stop if /opt/qtile exists but is not a valid venv
- name: FAILSAFE - Stop if /opt/qtile exists but is not a valid Python virtual environment
  fail:
    msg: |
      STOP: /opt/qtile directory exists but is not a valid Python virtual environment.
      This could be a different installation. Please backup or remove it manually.
      Found at: {{ qtile_venv_path }}
  when:
    - run_gui_failsafe_checks
    - qtile_venv_exists.stat.exists | default(false)
    - not (qtile_venv_valid.stat.exists | default(false))

# FAILSAFE: Stop if Alacritty source exists but is not the correct repository
- name: FAILSAFE - Stop if Alacritty source exists but is not our repository
  fail:
    msg: |
      STOP: ~/code/tools/alacritty exists but is not a git repository.
      This could be a different Alacritty installation. Please backup or remove it manually.
      Found at: {{ dev_home }}/code/tools/alacritty
  when:
    - run_gui_failsafe_checks
    - alacritty_source_exists.stat.exists | default(false)
    - not (alacritty_is_git_repo.stat.exists | default(false))

- name: FAILSAFE - Stop if Alacritty source is a different git repository
  fail:
    msg: |
      STOP: ~/code/tools/alacritty is a git repository but not the expected one.
      Expected repository: alacritty/alacritty via HTTPS or SSH
      Found: {{ alacritty_git_remote_url | default('') }}
      Please backup or remove it manually, or update the remote URL.
  when:
    - run_gui_failsafe_checks
    - alacritty_source_exists.stat.exists | default(false)
    - alacritty_is_git_repo.stat.exists | default(false)
    - not (alacritty_git_remote_url | default('') is regex(git_remote_match_alacritty))

# === SCRIPTS REPOSITORY CHECKS ===
- name: Check if scripts repository directory exists
  stat:
    path: "{{ dev_home }}/code/checkouts/personal/scripts"
  register: scripts_repo_dir

- name: Check if existing scripts directory is a git repository
  stat:
    path: "{{ dev_home }}/code/checkouts/personal/scripts/.git"
  register: scripts_is_git_repo
  when: scripts_repo_dir.stat.exists | default(false)

- name: Get scripts git remote URL if it's a git repository
  shell: |
    set -o pipefail
    git -C "{{ dev_home }}/code/checkouts/personal/scripts" remote get-url origin 2>/dev/null || echo "no-remote"
  args:
    executable: /bin/bash
  register: scripts_git_remote
  become: true
  become_user: "{{ dev_user }}"
  when:
    - scripts_repo_dir.stat.exists | default(false)
    - scripts_is_git_repo.stat.exists | default(false)
  changed_when: false
  failed_when: false

- name: Normalize scripts git remote
  set_fact:
    scripts_git_remote_url: "{{ scripts_git_remote.stdout | default('no-remote') | trim }}"
  when:
    - scripts_repo_dir.stat.exists | default(false)
    - scripts_is_git_repo.stat.exists | default(false)

- name: Get scripts current git branch if it's a git repository
  shell: |
    set -o pipefail
    git -C "{{ dev_home }}/code/checkouts/personal/scripts" branch --show-current 2>/dev/null || echo "unknown"
  args:
    executable: /bin/bash
  register: scripts_git_branch
  become: true
  become_user: "{{ dev_user }}"
  when:
    - scripts_repo_dir.stat.exists | default(false)
    - scripts_is_git_repo.stat.exists | default(false)
  changed_when: false
  failed_when: false

- name: Check for unstaged changes in scripts repository
  shell: |
    set -o pipefail
    git -C "{{ dev_home }}/code/checkouts/personal/scripts" status --porcelain 2>/dev/null | wc -l
  args:
    executable: /bin/bash
  register: scripts_unstaged_changes
  become: true
  become_user: "{{ dev_user }}"
  when:
    - scripts_repo_dir.stat.exists | default(false)
    - scripts_is_git_repo.stat.exists | default(false)
  changed_when: false
  failed_when: false

# FAILSAFE: Stop if scripts repo exists but is not the correct repository
- name: FAILSAFE - Stop if scripts repository exists but is not our repository
  fail:
    msg: |
      STOP: ~/code/checkouts/personal/scripts exists but is not a git repository.
      This could be a different scripts installation. Please backup or remove it manually.
      Found at: {{ dev_home }}/code/checkouts/personal/scripts
  when:
    - scripts_repo_dir.stat.exists | default(false)
    - not (scripts_is_git_repo.stat.exists | default(false))

- name: FAILSAFE - Stop if scripts repository is a different git repository
  fail:
    msg: |
      STOP: ~/code/checkouts/personal/scripts is a git repository but not the expected one.
      Expected repository: stonecharioteer/scripts via HTTPS or SSH
      Found: {{ scripts_git_remote_url | default('') }}
      rc={{ scripts_git_remote.rc | default('n/a') }}
      stderr={{ scripts_git_remote.stderr | default('') }}
      Please backup or remove it manually, or update the remote URL.
  when:
    - scripts_repo_dir.stat.exists | default(false)
    - scripts_is_git_repo.stat.exists | default(false)
    - not (scripts_git_remote_url | default('') is regex(git_remote_match_scripts))

# === FISH CONFIGURATION REPOSITORY CHECKS ===
- name: Check if fish config directory exists
  stat:
    path: "{{ dev_home }}/.config/fish"
  register: fish_config_exists

- name: Check if existing fish directory is a git repository
  stat:
    path: "{{ dev_home }}/.config/fish/.git"
  register: fish_is_git_repo
  when: fish_config_exists.stat.exists | default(false)

- name: Get fish git remote URL if it's a git repository
  shell: |
    set -o pipefail
    git -C "{{ dev_home }}/.config/fish" remote get-url origin 2>/dev/null || echo "no-remote"
  args:
    executable: /bin/bash
  register: fish_git_remote
  become: true
  become_user: "{{ dev_user }}"
  when:
    - fish_config_exists.stat.exists | default(false)
    - fish_is_git_repo.stat.exists | default(false)
  changed_when: false
  failed_when: false

- name: Normalize fish git remote
  set_fact:
    fish_git_remote_url: "{{ fish_git_remote.stdout | default('no-remote') | trim }}"
  when:
    - fish_config_exists.stat.exists | default(false)
    - fish_is_git_repo.stat.exists | default(false)

- name: Get fish current git branch if it's a git repository
  shell: |
    set -o pipefail
    git -C "{{ dev_home }}/.config/fish" branch --show-current 2>/dev/null || echo "unknown"
  args:
    executable: /bin/bash
  register: fish_git_branch
  become: true
  become_user: "{{ dev_user }}"
  when:
    - fish_config_exists.stat.exists | default(false)
    - fish_is_git_repo.stat.exists | default(false)
  changed_when: false
  failed_when: false

# FAILSAFE: If fish config exists but is not a git repo, back it up so the clone can proceed
- name: FAILSAFE - Back up non-git fish config directory
  command: mv {{ dev_home }}/.config/fish {{ dev_home }}/.config/fish.bak.{{ ansible_date_time.iso8601_basic_short }}
  become: true
  become_user: "{{ dev_user }}"
  when:
    - fish_config_exists.stat.exists | default(false)
    - not (fish_is_git_repo.stat.exists | default(false))

- name: Notify about fish config backup
  debug:
    msg: |
      ~/.config/fish existed but was not a git repository.
      It has been backed up to: {{ dev_home }}/.config/fish.bak.{{ ansible_date_time.iso8601_basic_short }}
  when:
    - fish_config_exists.stat.exists | default(false)
    - not (fish_is_git_repo.stat.exists | default(false))

- name: FAILSAFE - Stop if fish config is a different git repository
  fail:
    msg: |
      STOP: ~/.config/fish is a git repository but not the expected one.
      Expected repository: stonecharioteer/dotfiles-fish via HTTPS or SSH
      Found: {{ fish_git_remote_url | default('') }}
      Please backup or remove it manually, or update the remote URL.
  when:
    - fish_config_exists.stat.exists | default(false)
    - fish_is_git_repo.stat.exists | default(false)
    - not (fish_git_remote_url | default('') is regex(git_remote_match_fish))

# Set facts for other roles to use
- name: Set facts about current installation state
  set_fact:
    fish_config_repo_exists: "{{ (fish_config_exists.stat.exists | default(false)) and (fish_is_git_repo.stat.exists | default(false)) }}"
    scripts_repo_exists: "{{ (scripts_repo_dir.stat.exists | default(false)) and (scripts_is_git_repo.stat.exists | default(false)) }}"
    scripts_can_update: >-
      {{
        (scripts_repo_dir.stat.exists | default(false))
        and (scripts_is_git_repo.stat.exists | default(false))
        and ((scripts_git_branch.stdout | default('')) | trim == 'main')
        and ((scripts_unstaged_changes.stdout | default('1') | trim) == '0')
      }}

- name: Set facts about current GUI installation state
  set_fact:
    qtile_config_repo_exists: "{{ (qtile_config_exists.stat.exists | default(false)) and (qtile_is_git_repo.stat.exists | default(false)) }}"
    qtile_venv_ready: "{{ (qtile_venv_exists.stat.exists | default(false)) and (qtile_venv_valid.stat.exists | default(false)) }}"
    qtile_already_installed: >-
      {{
        (qtile_venv_exists.stat.exists | default(false))
        and (qtile_venv_valid.stat.exists | default(false))
        and (qtile_installed_check is defined)
        and ((qtile_installed_check.stdout | default('')) | trim == 'installed')
      }}
    alacritty_source_repo_exists: "{{ (alacritty_source_exists.stat.exists | default(false)) and (alacritty_is_git_repo.stat.exists | default(false)) }}"
    alacritty_already_built: "{{ alacritty_binary_exists.stat.exists | default(false) }}"
  when: run_gui_failsafe_checks

# Hardware Detection for conditional features
- name: Hardware detection for conditional features
  block:
    - name: Check for battery (primary laptop indicator)
      stat:
        path: /sys/class/power_supply/BAT0
      register: battery_check

    - name: Check for laptop DMI chassis type
      shell: dmidecode -s chassis-type 2>/dev/null || echo "unknown"
      args:
        executable: /bin/bash
      register: chassis_type
      changed_when: false
      failed_when: false

    - name: Check for laptop keywords in DMI product name
      shell: dmidecode -s system-product-name 2>/dev/null | grep -i -E "(laptop|notebook|portable)" || echo "none"
      args:
        executable: /bin/bash
      register: product_name_check
      changed_when: false
      failed_when: false

    - name: Set hardware detection facts
      set_fact:
        is_laptop: >-
          {{
            (battery_check.stat.exists | default(false))
            or ((chassis_type.stdout | default('')) in ['Notebook', 'Laptop', 'Portable'])
            or ((product_name_check.stdout | default('none')) != "none")
          }}
  when: run_gui_failsafe_checks

- name: Display installation plan
  debug:
    msg: |
      {% if run_gui_failsafe_checks %}
      === HARDWARE DETECTION ===
      System type: {{ 'LAPTOP' if is_laptop else 'DESKTOP' }}
      Battery detected: {{ battery_check.stat.exists | default(false) }}
      Chassis type: {{ chassis_type.stdout | default('unknown') }}

      {% endif %}
      === INSTALLATION PLAN ===
      Fish config: {{ 'USE existing repository' if fish_config_repo_exists else 'CLONE new repository' }}
      Scripts repo: {{ 'USE existing repository' if scripts_repo_exists else 'CLONE new repository' }}
      {% if run_gui_failsafe_checks %}
      Qtile config: {{ 'USE existing repository' if qtile_config_repo_exists else 'CLONE new repository' }}
      Python venv: {{ 'USE existing venv' if qtile_venv_ready else 'CREATE new venv' }}
      Qtile package: {{ 'SKIP - already installed' if qtile_already_installed else 'INSTALL qtile + psutil' }}
      Alacritty source: {{ 'USE existing repository' if alacritty_source_repo_exists else 'CLONE new repository' }}
      Alacritty binary: {{ 'SKIP - already built' if alacritty_already_built else 'BUILD from source' }}

      {{ 'LAPTOP FEATURES: Battery monitoring, touchpad gestures, auto-rotation, sleep services' if is_laptop else 'DESKTOP FEATURES: Monitor management only (no laptop-specific features)' }}
      {% endif %}

      Proceeding with safe, non-destructive operations...
