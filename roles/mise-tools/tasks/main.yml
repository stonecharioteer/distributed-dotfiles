---
# Include macOS-specific tasks
- name: Include macOS-specific tasks
  include_tasks: darwin.yml
  when: ansible_facts["os_family"] == "Darwin"
  tags: blog

- name: Install essential build tools (Debian/Ubuntu)
  package:
    name:
      - build-essential
      - pkg-config
      - libssl-dev
      - bison
      - flex
      - make
      - cmake
      - autoconf
      - automake
      - libtool
      - git
      - curl
      - wget
      - unzip
      - tar
      - gzip
      - m4
      - texinfo
      - gettext
      - zlib1g-dev
      - libffi-dev
      - libncurses5-dev
      - libreadline-dev
      - libsqlite3-dev
      - libgdbm-dev
      - libbz2-dev
      - liblzma-dev
      - uuid-dev
    state: present
  when: ansible_facts["os_family"] == "Debian"

- name: Install essential build tools (Arch)
  package:
    name:
      - base-devel
      - openssl
      - pkg-config
      - bison
      - flex
      - make
      - cmake
      - autoconf
      - automake
      - libtool
      - git
      - curl
      - wget
      - unzip
      - tar
      - gzip
      - m4
      - texinfo
      - gettext
      - zlib
      - libffi
      - ncurses
      - readline
      - sqlite
      - gdbm
      - bzip2
      - xz
      - util-linux
    state: present
  when: ansible_facts["os_family"] == "Archlinux"

- name: Install essential build tools (Fedora)
  package:
    name:
      - gcc
      - gcc-c++
      - make
      - cmake
      - autoconf
      - automake
      - libtool
      - pkg-config
      - openssl-devel
      - bison
      - flex
      - git
      - curl
      - wget
      - unzip
      - tar
      - gzip
      - m4
      - texinfo
      - gettext
      - zlib-devel
      - libffi-devel
      - ncurses-devel
      - readline-devel
      - sqlite-devel
      - gdbm-devel
      - bzip2-devel
      - xz-devel
      - libuuid-devel
    state: present
  when: ansible_facts["os_family"] == "RedHat"

- name: Check if mise is already installed
  stat:
    path: "{{ dev_home }}/.local/bin/mise"
  register: mise_exists
  become: no
  tags: blog

- name: Download and install mise (runtime version manager)
  shell: |
    curl https://mise.run | sh
  become: no
  environment:
    HOME: "{{ dev_home }}"
  when: not mise_exists.stat.exists
  tags: blog

- name: Create mise config directory
  file:
    path: "{{ dev_home }}/.config/mise"
    state: directory
    owner: "{{ dev_user }}"
    group: "{{ 'staff' if ansible_facts['os_family'] == 'Darwin' else dev_user }}"
    mode: '0755'
  become: no
  tags: blog

# Ruby is not managed here. Keep any installation needed by other software.
- name: Install latest Node.js and pnpm via mise
  command:
    argv:
      - "{{ dev_home }}/.local/bin/mise"
      - use
      - -g
      - node@latest
      - pnpm@latest
  environment:
    HOME: "{{ dev_home }}"
  become: no
  tags: blog

# Python management handled separately via uv instead of mise

- name: Install Go via mise
  command:
    argv:
      - "{{ dev_home }}/.local/bin/mise"
      - use
      - -g
      - go@latest
  environment:
    HOME: "{{ dev_home }}"
  become: no
  ignore_errors: yes

# Rust management handled separately via system installation

- name: Install fx JSON viewer via Go (if Go is available)
  command:
    argv:
      - "{{ dev_home }}/.local/bin/mise"
      - exec
      - --
      - go
      - install
      - github.com/antonmedv/fx@latest
    creates: "{{ dev_home }}/go/bin/fx"
  become: no
  environment:
    HOME: "{{ dev_home }}"
    GOBIN: "{{ dev_home }}/go/bin"
  ignore_errors: yes

- name: Check if uv is already installed
  shell: command -v uv
  args:
    executable: /bin/bash
  register: uv_exists
  become: no
  changed_when: false
  failed_when: false

- name: Install uv Python package manager via official installer
  shell: |
    curl -LsSf https://astral.sh/uv/install.sh | sh
  environment:
    HOME: "{{ dev_home }}"
  become: no
  when: uv_exists.rc != 0

- name: Remove legacy fish universal path override
  lineinfile:
    path: "{{ dev_home }}/.config/fish/fish_variables"
    regexp: "^SETUVAR dev_user_paths:"
    state: absent
  become: no
  failed_when: false

- name: Ensure mise paths are added with fish_add_path
  blockinfile:
    path: "{{ dev_home }}/.config/fish/config.fish"
    marker: "# {mark} ANSIBLE MANAGED MISE PATHS"
    block: |
      fish_add_path {{ dev_home }}/.local/bin
      fish_add_path {{ dev_home }}/.cargo/bin
      fish_add_path {{ dev_home }}/.fzf/bin
      {% if ansible_facts['os_family'] == 'Darwin' %}
      fish_add_path /opt/homebrew/bin
      fish_add_path /opt/homebrew/sbin
      {% endif %}
    create: yes
    owner: "{{ dev_user }}"
    group: "{{ 'staff' if ansible_facts['os_family'] == 'Darwin' else dev_user }}"
    mode: '0644'
  become: no
