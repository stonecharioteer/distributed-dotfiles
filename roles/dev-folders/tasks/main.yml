---
- name: Create development directory structure
  file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ dev_user }}"
    group: "{{ 'staff' if ansible_facts['os_family'] == 'Darwin' else dev_user }}"
    mode: "{{ item.mode }}"
  loop: "{{ dev_directories }}"
  # Run as root so ownership can be applied reliably even when the play
  # connection user is ambiguous (e.g. ansible_user unset, SSH config only).
  become: true

- name: Display created directories
  debug:
    msg: |
      Development directories created:
      {% for dir in dev_directories %}
      - {{ dir.path }}
      {% endfor %}

- name: Verify directory ownership
  stat:
    path: "{{ dev_home }}/code"
  register: code_dir_stat

- name: Display directory status
  debug:
    msg: |
      Directory ownership verification:
      Path: {{ dev_home }}/code
      Exists: {{ code_dir_stat.stat.exists | default(false) }}
      Owner: {{ code_dir_stat.stat.pw_name | default(code_dir_stat.stat.uid | default('n/a'), true) }}
      Group: {{ code_dir_stat.stat.gr_name | default(code_dir_stat.stat.gid | default('n/a'), true) }}
      Mode: {{ code_dir_stat.stat.mode | default('n/a') }}

- name: Fail when development code directory is missing
  fail:
    msg: >-
      Expected {{ dev_home }}/code to exist after dev-folders setup
      (dev_user={{ dev_user }}, dev_home={{ dev_home }}).
  when: not (code_dir_stat.stat.exists | default(false))

- name: Create useful symlinks
  file:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    state: link
    owner: "{{ dev_user }}"
    group: "{{ 'staff' if ansible_facts['os_family'] == 'Darwin' else dev_user }}"
  loop:
    - src: "{{ dev_home }}/code/checkouts/personal"
      dest: "{{ dev_home }}/personal"
    - src: "{{ dev_home }}/workspace/scratch"
      dest: "{{ dev_home }}/scratch"
  become: true
  failed_when: false  # Don't fail if symlinks already exist

- name: Display setup completion
  debug:
    msg: |
      Development folder structure setup complete!

      Directory structure:
      ~/code/
      ├── checkouts/
      │   ├── personal/    (symlinked to ~/personal)
      │   └── work/
      └── tools/

      ~/workspace/
      ├── projects/
      └── scratch/         (symlinked to ~/scratch)

      ~/Pictures/screenshots/
      ~/.local/bin/
