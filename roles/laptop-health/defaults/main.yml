---
# General laptop health/server-mode defaults.
enable_laptop_health_monitoring: false
enable_laptop_lid_ignore: false
enable_laptop_sysrq: true
enable_laptop_panic_reboot: false
enable_nvme_health_monitoring: true

# Battery charge thresholds (ThinkPad/Lenovo sysfs charge_control_*).
# Mirrors scripts/laptops-setup/t14-g2/setup-headless-lid-battery.sh.
enable_battery_charge_thresholds: false
battery_charge_start_threshold: 55
battery_charge_stop_threshold: 60
# Empty = auto-detect first BAT* under /sys/class/power_supply.
battery_sysfs_name: ""

# Continuous user-level health TSV logger from the scripts checkout.
# Mirrors scripts/laptops-setup/t14-g2/setup-headless-health-monitor.sh.
enable_headless_health_monitor: false
headless_health_monitor_interval_seconds: 60
headless_health_monitor_enable_linger: true
laptop_scripts_root: "{{ dev_home }}/code/checkouts/personal/scripts"
headless_health_monitor_script: "{{ laptop_scripts_root }}/laptops-setup/t14-g2/headless-health-monitor.sh"
headless_health_monitor_unit_dir: "{{ dev_home }}/.config/systemd/user"
headless_health_monitor_log_dir: "{{ dev_home }}/headless-monitor/logs"

# Keep SSH sessions alive for headless laptop/server use.
# Mirrors scripts/laptops-setup/t14-g2/setup-ssh-long-lived.sh.
enable_ssh_long_lived: false
ssh_client_alive_interval: 30
ssh_client_alive_count_max: 240

# X13 Flow/tent-mode display controls.
enable_x13_screen_keepoff: false
enable_lightdm_display_sleep: false
enable_nvidia_integrated_mode: false
enable_nouveau_blacklist_fix: false

laptop_health_log_file: /var/log/hang-health.log
nvme_health_log_file: /var/log/nvme-health.log
nvme_health_smartctl_device: /dev/nvme0n1
nvme_health_nvme_device: /dev/nvme0

# Prefer core scripts from the scripts checkout. Keep the qtile path as a
# transition fallback until the scripts are moved out of dotfiles-qtile.
laptop_scripts_dir: "{{ laptop_scripts_root }}/laptop"
x13_screen_script_candidates:
  - "{{ laptop_scripts_dir }}/x13-flow/screen.sh"
  - "{{ dev_home }}/.config/qtile/laptop/x13-flow/screen.sh"

lightdm_display_sleep_blank_seconds: 300
lightdm_display_sleep_standby_seconds: 300
lightdm_display_sleep_suspend_seconds: 600
lightdm_display_sleep_off_seconds: 900

dev_user: stonecharioteer
dev_home: "/home/{{ dev_user }}"
