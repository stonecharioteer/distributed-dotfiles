---
- name: reload systemd daemon
  systemd:
    daemon_reload: true

- name: restart systemd-logind
  systemd:
    name: systemd-logind
    state: restarted

- name: apply sysctl settings
  command: sysctl --system
  changed_when: true

- name: validate sshd config
  command: sshd -t
  changed_when: false

- name: reload sshd
  systemd:
    name: "{{ item }}"
    state: reloaded
  loop:
    - ssh
    - sshd
  failed_when: false
