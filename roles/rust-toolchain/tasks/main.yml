---
# Include macOS-specific tasks
- name: Include macOS-specific tasks
  include_tasks: darwin.yml
  when: ansible_facts["os_family"] == "Darwin"

- name: Check if rustup is already installed
  stat:
    path: "{{ dev_home }}/.cargo/bin/rustup"
  register: rustup_exists
  become: no

- name: Download rustup installer
  get_url:
    url: https://sh.rustup.rs
    dest: /tmp/rustup-init.sh
    mode: '0755'
  when: not rustup_exists.stat.exists
  become: no

- name: Install rustup (Rust toolchain installer)
  shell: /tmp/rustup-init.sh -y --default-toolchain stable
  environment:
    CARGO_HOME: "{{ dev_home }}/.cargo"
    RUSTUP_HOME: "{{ dev_home }}/.rustup"
  when: not rustup_exists.stat.exists
  become: no

- name: Source cargo environment
  shell: source "{{ dev_home }}/.cargo/env"
  args:
    executable: /bin/bash
  when: not rustup_exists.stat.exists
  become: no

- name: Check if cargo-binstall is already installed
  stat:
    path: "{{ dev_home }}/.cargo/bin/cargo-binstall"
  register: cargo_binstall_exists
  become: no

- name: Install cargo-binstall
  shell: |
    source "{{ dev_home }}/.cargo/env"
    cargo install cargo-binstall
  args:
    executable: /bin/bash
  environment:
    CARGO_HOME: "{{ dev_home }}/.cargo"
    RUSTUP_HOME: "{{ dev_home }}/.rustup"
  when: not cargo_binstall_exists.stat.exists
  become: no

- name: Install Rust CLI tools via cargo-binstall
  shell: |
    source "{{ dev_home }}/.cargo/env"
    cargo binstall -y {{ item }}
  args:
    executable: /bin/bash
  environment:
    CARGO_HOME: "{{ dev_home }}/.cargo"
    RUSTUP_HOME: "{{ dev_home }}/.rustup"
  with_items:
    - bat          # Better cat with syntax highlighting
    - tokei        # Code statistics
    - du-dust      # Better du
    - bottom       # Better top
    - xh           # Better httpie in Rust
    - eza          # Better ls (replaces exa)
    - lsd          # LSDeluxe - another modern ls
    - procs        # Better ps
    - sd           # Better sed
    - tealdeer     # tldr client
    - grex         # Regex generator
    - gitui        # Terminal UI for git
    - atuin        # Shell history sync and search
  become: no
  ignore_errors: yes

# Note: ripgrep, fd, zoxide, starship are installed via package manager in cli-tools role
# This avoids conflicts and uses system package manager when available

- name: Add cargo bin to fish config with fish_add_path
  lineinfile:
    path: "{{ dev_home }}/.config/fish/config.fish"
    line: "fish_add_path {{ dev_home }}/.cargo/bin"
    regexp: "^fish_add_path {{ dev_home | regex_escape }}/\\.cargo/bin$"
    create: yes
    owner: "{{ dev_user }}"
    group: "{{ 'staff' if ansible_facts['os_family'] == 'Darwin' else dev_user }}"
    mode: '0644'
  become: no

- name: Ensure cargo bin directory is in PATH
  lineinfile:
    path: "{{ dev_home }}/.profile"
    line: 'export PATH="$HOME/.cargo/bin:$PATH"'
    create: yes
    owner: "{{ dev_user }}"
    group: "{{ 'staff' if ansible_facts['os_family'] == 'Darwin' else dev_user }}"
  become: no
