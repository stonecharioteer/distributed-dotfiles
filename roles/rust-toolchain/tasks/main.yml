---
# Rustup and the verified cargo-binstall release work on Linux and macOS.

- name: Check if rustup is already installed
  stat:
    path: "{{ dev_home }}/.cargo/bin/rustup"
  register: rustup_exists
  become: no

- name: Download rustup installer
  get_url:
    url: https://sh.rustup.rs
    dest: /tmp/rustup-init.sh
    mode: '0755'
  when: not rustup_exists.stat.exists
  become: no

- name: Install rustup (Rust toolchain installer)
  shell: /tmp/rustup-init.sh -y --default-toolchain stable
  environment:
    CARGO_HOME: "{{ dev_home }}/.cargo"
    RUSTUP_HOME: "{{ dev_home }}/.rustup"
  when: not rustup_exists.stat.exists
  become: no

- name: Clean up rustup installer
  file:
    path: /tmp/rustup-init.sh
    state: absent
  when: not rustup_exists.stat.exists
  become: no

- name: Install Rust CLI tools from prebuilt binaries
  include_role:
    name: cargo-binstall
  vars:
    cargo_binstall_tools: "{{ rust_cli_tools }}"

# Note: ripgrep, fd, zoxide, starship are installed via package manager in cli-tools role
# This avoids conflicts and uses system package manager when available

- name: Add cargo bin to fish config with fish_add_path
  lineinfile:
    path: "{{ dev_home }}/.config/fish/config.fish"
    line: "fish_add_path {{ dev_home }}/.cargo/bin"
    regexp: "^fish_add_path {{ dev_home | regex_escape }}/\\.cargo/bin$"
    create: yes
    owner: "{{ dev_user }}"
    group: "{{ 'staff' if ansible_facts['os_family'] == 'Darwin' else dev_user }}"
    mode: '0644'
  become: no

- name: Ensure cargo bin directory is in PATH
  lineinfile:
    path: "{{ dev_home }}/.profile"
    line: 'export PATH="$HOME/.cargo/bin:$PATH"'
    create: yes
    owner: "{{ dev_user }}"
    group: "{{ 'staff' if ansible_facts['os_family'] == 'Darwin' else dev_user }}"
  become: no
