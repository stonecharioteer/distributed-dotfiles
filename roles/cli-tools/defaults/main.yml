---
# Default variables for cli-tools role
dev_user: "{{ ansible_user | default('stonecharioteer') }}"
dev_home: "/home/{{ dev_user }}"

# Modern CLI tools for development productivity.
# Keep required tools to packages that should exist on supported Ubuntu/Debian
# systems. Optional/fun tools are installed only when the package exists in the
# target's enabled repositories.
cli_packages_required:
  # File and text search tools (Rust-based, via package manager)
  - ripgrep        # Fast text search
  - fd-find        # Fast file search
  - tree           # Directory visualization
  - fzf            # Fuzzy finder
  - zoxide         # Smart directory navigation

  # Development utilities
  - direnv         # Environment variable management
  - httpie         # Modern HTTP client
  - pgcli          # Modern PostgreSQL client with syntax highlighting
  - jq             # JSON processor
  - yq             # YAML processor

  # System monitoring and utilities
  - htop           # Process viewer (if not in system-deps)
  - btop           # Modern system resource monitor (C++)

cli_packages_optional:
  # Fun/system-info tools; these vary across Ubuntu/Debian releases and repos.
  - cowsay         # ASCII art messages
  - fortune-mod    # Random quotes
  - lolcat         # Colorful output
  - fastfetch      # System information (neofetch replacement on newer Ubuntu)
  - screenfetch    # Alternative system info

# Backwards-compatible combined list for external overrides/documentation.
cli_packages: "{{ cli_packages_required + cli_packages_optional }}"

# Tools installed via external methods
external_tools:
  starship:
    url: "https://starship.rs/install.sh"
    binary_path: "/usr/local/bin/starship"
    check_cmd: "starship --version"

  charm:
    repo_key: "https://repo.charm.sh/apt/gpg.key"
    keyring_path: "/usr/share/keyrings/charm-archive-keyring.asc"
    repo_line: "deb [signed-by=/usr/share/keyrings/charm-archive-keyring.asc] https://repo.charm.sh/apt/ * *"

  gum:
    package: "gum"
    check_cmd: "gum --version"

  glow:
    package: "glow"
    check_cmd: "glow --version"

# Tools installed via cargo (requires Rust from mise/fish setup)
cargo_tools:
  watchexec-cli:
    package: "watchexec-cli"
    binary: "watchexec"
    check_cmd: "watchexec --version"

  bandwhich:
    package: "bandwhich"
    binary: "bandwhich"
    check_cmd: "bandwhich --version"

  just:
    package: "just"
    binary: "just"
    check_cmd: "just --version"

  amdgpu_top:
    package: "amdgpu_top"
    binary: "amdgpu_top"
    check_cmd: "amdgpu_top --version"

  ast-grep:
    package: "ast-grep"
    binary: "ast-grep"
    check_cmd: "ast-grep --version"

# Cargo tools to install via cargo binstall on macOS (others use Homebrew)
macos_cargo_tools:
  - ast-grep
