---
# Include macOS-specific tasks
- name: Include macOS-specific tasks
  include_tasks: darwin.yml
  when: ansible_facts["os_family"] == "Darwin"

- name: Install required CLI development tools via package manager
  package:
    name: "{{ cli_packages_required }}"
    state: present
  when: ansible_facts["os_family"] == "Debian"

- name: Check optional CLI package availability
  # Use policy Candidate so virtual/missing packages are not treated as installable.
  shell: set -o pipefail; apt-cache policy {{ item | quote }} | awk '/^  Candidate:/ {print $2}'
  args:
    executable: /bin/bash
  loop: "{{ cli_packages_optional }}"
  register: optional_cli_package_checks
  changed_when: false
  failed_when: false
  when: ansible_facts["os_family"] == "Debian"

- name: Create list of available optional CLI packages
  set_fact:
    available_optional_cli_packages: >-
      {{ optional_cli_package_checks.results
         | selectattr('stdout', 'defined')
         | selectattr('stdout', 'ne', '')
         | selectattr('stdout', 'ne', '(none)')
         | map(attribute='item')
         | list }}
    unavailable_optional_cli_packages: >-
      {{ optional_cli_package_checks.results
         | selectattr('item', 'defined')
         | rejectattr('stdout', 'defined')
         | map(attribute='item')
         | list
         + (optional_cli_package_checks.results
            | selectattr('stdout', 'defined')
            | selectattr('stdout', 'in', ['', '(none)'])
            | map(attribute='item')
            | list) }}
  when: ansible_facts["os_family"] == "Debian"

- name: Install available optional CLI packages
  package:
    name: "{{ item }}"
    state: present
  loop: "{{ available_optional_cli_packages }}"
  register: optional_cli_package_installs
  failed_when: false
  when:
    - ansible_facts["os_family"] == "Debian"
    - available_optional_cli_packages | length > 0

- name: Track optional CLI packages that failed to install
  set_fact:
    unavailable_optional_cli_packages: >-
      {{ (unavailable_optional_cli_packages | default([]))
         + (optional_cli_package_installs.results
            | default([])
            | selectattr('failed', 'defined')
            | selectattr('failed')
            | map(attribute='item')
            | list)
         + (optional_cli_package_installs.results
            | default([])
            | selectattr('failed', 'undefined')
            | selectattr('rc', 'defined')
            | rejectattr('rc', 'eq', 0)
            | map(attribute='item')
            | list)
         | unique
         | list }}
  when:
    - ansible_facts["os_family"] == "Debian"
    - optional_cli_package_installs is defined

- name: Display skipped optional CLI packages
  debug:
    msg: "Skipping unavailable optional CLI packages: {{ unavailable_optional_cli_packages | join(', ') }}"
  when:
    - ansible_facts["os_family"] == "Debian"
    - unavailable_optional_cli_packages | length > 0

- name: Create fd symlink (Ubuntu packages fd-find as fdfind)
  file:
    src: /usr/bin/fdfind
    dest: /usr/local/bin/fd
    state: link
  when: ansible_facts["os_family"] == "Debian"
  ignore_errors: yes

- name: Check if Starship is already installed
  shell: "command -v starship >/dev/null 2>&1 && {{ external_tools.starship.check_cmd }}"
  args:
    executable: /bin/bash
  register: starship_check
  changed_when: false
  failed_when: false

- name: Install Starship prompt
  block:
    - name: Download Starship installer
      get_url:
        url: "{{ external_tools.starship.url }}"
        dest: /tmp/install-starship.sh
        mode: '0755'

    - name: Install Starship
      shell: /tmp/install-starship.sh --yes
      environment:
        BIN_DIR: /usr/local/bin

    - name: Clean up Starship installer
      file:
        path: /tmp/install-starship.sh
        state: absent

    - name: Verify Starship installation
      command: "{{ external_tools.starship.check_cmd }}"
      register: starship_version
      changed_when: false

    - name: Display Starship installation success
      debug:
        msg: "✓ Starship installed: {{ starship_version.stdout }}"

  when:
    - ansible_facts["os_family"] != "Darwin"
    - starship_check.rc != 0
  rescue:
    - name: Display Starship installation failure
      debug:
        msg: "⚠ Starship installation failed - continuing with other tools"

- name: Check if Gum is already installed
  shell: "command -v gum >/dev/null 2>&1 && {{ external_tools.gum.check_cmd }}"
  args:
    executable: /bin/bash
  register: gum_check
  changed_when: false
  failed_when: false

- name: Install Gum terminal UI tools
  block:
    - name: Add Charm repository GPG key
      get_url:
        url: "{{ external_tools.charm.repo_key }}"
        dest: "{{ external_tools.charm.keyring_path }}"
        mode: '0644'

    - name: Add Charm repository
      apt_repository:
        repo: "{{ external_tools.charm.repo_line }}"
        state: present

    - name: Install Gum
      package:
        name: "{{ external_tools.gum.package }}"
        state: present
        update_cache: yes

    - name: Verify Gum installation
      command: "{{ external_tools.gum.check_cmd }}"
      register: gum_version
      changed_when: false

    - name: Display Gum installation success
      debug:
        msg: "✓ Gum installed: {{ gum_version.stdout }}"

  when:
    - ansible_facts["os_family"] == "Debian"
    - gum_check.rc != 0
  rescue:
    - name: Display Gum installation failure
      debug:
        msg: "⚠ Gum installation failed - continuing with other tools"

- name: Check if Glow is already installed
  shell: "command -v glow >/dev/null 2>&1 && {{ external_tools.glow.check_cmd }}"
  args:
    executable: /bin/bash
  register: glow_check
  changed_when: false
  failed_when: false

- name: Install Glow markdown renderer
  block:
    - name: Add Charm repository GPG key (if not already added)
      get_url:
        url: "{{ external_tools.charm.repo_key }}"
        dest: "{{ external_tools.charm.keyring_path }}"
        mode: '0644'

    - name: Add Charm repository (if not already added)
      apt_repository:
        repo: "{{ external_tools.charm.repo_line }}"
        state: present

    - name: Install Glow
      package:
        name: "{{ external_tools.glow.package }}"
        state: present
        update_cache: yes

    - name: Verify Glow installation
      command: "{{ external_tools.glow.check_cmd }}"
      register: glow_version
      changed_when: false

    - name: Display Glow installation success
      debug:
        msg: "✓ Glow installed: {{ glow_version.stdout }}"

  when:
    - ansible_facts["os_family"] == "Debian"
    - glow_check.rc != 0
  rescue:
    - name: Display Glow installation failure
      debug:
        msg: "⚠ Glow installation failed - continuing with other tools"

- name: Check if Rust/cargo is available for cargo tools
  shell: |
    source {{ dev_home }}/.cargo/env
    command -v cargo
  args:
    executable: /bin/bash
  register: cargo_check
  become_user: "{{ dev_user }}"
  ignore_errors: yes
  changed_when: false

- name: Install cargo-based tools
  block:
    - name: Check if cargo-binstall is available
      shell: |
        source {{ dev_home }}/.cargo/env
        command -v cargo-binstall
      args:
        executable: /bin/bash
      register: cargo_binstall_check
      become_user: "{{ dev_user }}"
      ignore_errors: yes
      changed_when: false

    - name: Install cargo-binstall if not available
      shell: |
        source {{ dev_home }}/.cargo/env
        cargo install cargo-binstall
      args:
        executable: /bin/bash
      become_user: "{{ dev_user }}"
      environment:
        HOME: "{{ dev_home }}"
      when: cargo_binstall_check.rc != 0

    - name: Install cargo tools via binstall
      shell: |
        source {{ dev_home }}/.cargo/env
        if ! command -v "{{ item.value.binary }}" &>/dev/null; then
          echo "Installing {{ item.value.package }}..."
          cargo binstall -y "{{ item.value.package }}"
        else
          echo "{{ item.value.binary }} is already installed"
        fi
        {{ item.value.check_cmd }} || true
      args:
        executable: /bin/bash
      loop: "{{ cargo_tools | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      become_user: "{{ dev_user }}"
      environment:
        HOME: "{{ dev_home }}"
      register: cargo_tool_results
      changed_when: "'Installing' in item.stdout | default('')"

    - name: Set capabilities for bandwhich (allows running without sudo)
      command: setcap cap_sys_ptrace,cap_dac_read_search,cap_net_raw,cap_net_admin+ep {{ dev_home }}/.cargo/bin/bandwhich
      ignore_errors: yes
      when: "'bandwhich' in (cargo_tools | list)"

  when:
    - ansible_facts["os_family"] != "Darwin"
    - cargo_check.rc == 0
  rescue:
    - name: Display cargo tools installation failure
      debug:
        msg: "⚠ Cargo tools installation failed - ensure Rust is installed (system installation)"

- name: Verify CLI tools installation
  command: "{{ item }} --version"
  loop:
    - rg              # ripgrep
    - fd              # fd-find
    - fzf
    - zoxide
    - direnv
    - http            # httpie
  register: cli_tool_versions
  changed_when: false
  ignore_errors: yes

- name: Display CLI tools installation summary
  debug:
    msg: |
      CLI Development Tools Installation Summary:

      {% if ansible_facts['os_family'] == "Darwin" %}
      ✓ All CLI tools installed via Homebrew on macOS
      {% else %}
      Package-based tools: {{ cli_packages | join(', ') }}

      Cargo tools:
      {% if cargo_tool_results is defined %}
      {% for result in cargo_tool_results.results %}
      {% if 'Installing' in result.stdout | default('') %}
      ✓ {{ result.item.key }} installed via cargo binstall
      {% else %}
      ✓ {{ result.item.key }} already installed
      {% endif %}
      {% endfor %}
      {% elif cargo_check is defined and cargo_check.rc != 0 %}
      ⚠ Cargo not available - cargo tools skipped
      {% endif %}
      {% endif %}

      Verified tools:
      {% for result in cli_tool_versions.results %}
      {% if result.rc == 0 %}
      ✓ {{ result.item }}
      {% else %}
      ⚠ {{ result.item }} not available
      {% endif %}
      {% endfor %}
