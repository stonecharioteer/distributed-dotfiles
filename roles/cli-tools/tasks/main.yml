---
# Include macOS-specific tasks
- name: Include macOS-specific tasks
  include_tasks: darwin.yml
  when: ansible_facts["os_family"] == "Darwin"

- name: Install required CLI development tools via package manager
  package:
    name: "{{ cli_packages_required }}"
    state: present
  when: ansible_facts["os_family"] == "Debian"

- name: Check optional CLI package availability
  # Use policy Candidate so virtual/missing packages are not treated as installable.
  shell: set -o pipefail; apt-cache policy {{ item | quote }} | awk '/^  Candidate:/ {print $2}'
  args:
    executable: /bin/bash
  loop: "{{ cli_packages_optional }}"
  register: optional_cli_package_checks
  changed_when: false
  failed_when: false
  when: ansible_facts["os_family"] == "Debian"

- name: Create list of available optional CLI packages
  set_fact:
    available_optional_cli_packages: >-
      {{ optional_cli_package_checks.results
         | selectattr('stdout', 'defined')
         | selectattr('stdout', 'ne', '')
         | selectattr('stdout', 'ne', '(none)')
         | map(attribute='item')
         | list }}
    unavailable_optional_cli_packages: >-
      {{ optional_cli_package_checks.results
         | selectattr('item', 'defined')
         | rejectattr('stdout', 'defined')
         | map(attribute='item')
         | list
         + (optional_cli_package_checks.results
            | selectattr('stdout', 'defined')
            | selectattr('stdout', 'in', ['', '(none)'])
            | map(attribute='item')
            | list) }}
  when: ansible_facts["os_family"] == "Debian"

- name: Install available optional CLI packages
  package:
    name: "{{ item }}"
    state: present
  loop: "{{ available_optional_cli_packages }}"
  register: optional_cli_package_installs
  failed_when: false
  when:
    - ansible_facts["os_family"] == "Debian"
    - available_optional_cli_packages | length > 0

- name: Track optional CLI packages that failed to install
  set_fact:
    unavailable_optional_cli_packages: >-
      {{ (unavailable_optional_cli_packages | default([]))
         + (optional_cli_package_installs.results
            | default([])
            | selectattr('failed', 'defined')
            | selectattr('failed')
            | map(attribute='item')
            | list)
         + (optional_cli_package_installs.results
            | default([])
            | selectattr('failed', 'undefined')
            | selectattr('rc', 'defined')
            | rejectattr('rc', 'eq', 0)
            | map(attribute='item')
            | list)
         | unique
         | list }}
  when:
    - ansible_facts["os_family"] == "Debian"
    - optional_cli_package_installs is defined

- name: Display skipped optional CLI packages
  debug:
    msg: "Skipping unavailable optional CLI packages: {{ unavailable_optional_cli_packages | join(', ') }}"
  when:
    - ansible_facts["os_family"] == "Debian"
    - unavailable_optional_cli_packages | length > 0

- name: Create fd symlink (Ubuntu packages fd-find as fdfind)
  file:
    src: /usr/bin/fdfind
    dest: /usr/local/bin/fd
    state: link
  when: ansible_facts["os_family"] == "Debian"
  ignore_errors: yes

- name: Check if Starship is already installed
  shell: "command -v starship >/dev/null 2>&1 && {{ external_tools.starship.check_cmd }}"
  args:
    executable: /bin/bash
  register: starship_check
  changed_when: false
  failed_when: false

- name: Install Starship prompt
  block:
    - name: Download Starship installer
      get_url:
        url: "{{ external_tools.starship.url }}"
        dest: /tmp/install-starship.sh
        mode: '0755'

    - name: Install Starship
      shell: /tmp/install-starship.sh --yes
      environment:
        BIN_DIR: /usr/local/bin

    - name: Clean up Starship installer
      file:
        path: /tmp/install-starship.sh
        state: absent

    - name: Verify Starship installation
      command: "{{ external_tools.starship.check_cmd }}"
      register: starship_version
      changed_when: false

    - name: Display Starship installation success
      debug:
        msg: "✓ Starship installed: {{ starship_version.stdout }}"

  when:
    - ansible_facts["os_family"] != "Darwin"
    - starship_check.rc != 0
  rescue:
    - name: Display Starship installation failure
      debug:
        msg: "⚠ Starship installation failed - continuing with other tools"

- name: Install Gum and Glow from the Charm repository
  block:
    - name: Install Charm repository prerequisites
      apt:
        name:
          - ca-certificates
          - python3-debian
        state: present
        update_cache: yes
        cache_valid_time: 86400

    - name: Add Charm repository GPG key
      get_url:
        url: "{{ external_tools.charm.repo_key }}"
        dest: "{{ external_tools.charm.keyring_path }}"
        mode: '0644'

    - name: Remove legacy Charm repository definition
      file:
        path: /etc/apt/sources.list.d/repo_charm_sh_apt.list
        state: absent

    - name: Add Charm repository
      deb822_repository:
        name: charm
        types:
          - deb
        uris:
          - "{{ external_tools.charm.repo_uri }}"
        suites: "{{ external_tools.charm.repo_suites }}"
        components: "{{ external_tools.charm.repo_components }}"
        signed_by: "{{ external_tools.charm.keyring_path }}"
        state: present
      register: charm_repository

    - name: Install Gum and Glow
      apt:
        name:
          - "{{ external_tools.gum.package }}"
          - "{{ external_tools.glow.package }}"
        state: present
        update_cache: yes
        # A new source requires a refresh even if the cache is recent.
        cache_valid_time: "{{ 0 if charm_repository.changed else 86400 }}"

  when: ansible_facts["os_family"] == "Debian"
  rescue:
    - name: Display Charm tools installation failure
      debug:
        msg: "Gum/Glow setup failed: {{ ansible_failed_result.msg | default('unknown error') }}"

- name: Install Cargo development tools from prebuilt binaries
  include_role:
    name: cargo-binstall
  vars:
    cargo_binstall_tools: "{{ cargo_tools | dict2items | map(attribute='value') | list }}"
  when: ansible_facts["os_family"] != "Darwin"

- name: Set capabilities for bandwhich (allows running without sudo)
  command: setcap cap_sys_ptrace,cap_dac_read_search,cap_net_raw,cap_net_admin+ep {{ dev_home }}/.cargo/bin/bandwhich
  ignore_errors: yes
  when:
    - ansible_facts["os_family"] != "Darwin"
    - "'bandwhich' in (cargo_tools | list)"

- name: Verify CLI tools installation
  command: "{{ item }} --version"
  loop:
    - rg              # ripgrep
    - fd              # fd-find
    - fzf
    - zoxide
    - direnv
    - http            # httpie
  register: cli_tool_versions
  changed_when: false
  ignore_errors: yes

- name: Display CLI tools installation summary
  debug:
    msg: |
      CLI Development Tools Installation Summary:

      {% if ansible_facts['os_family'] == "Darwin" %}
      CLI tools managed via Homebrew and prebuilt Cargo packages on macOS
      {% else %}
      Package-based tools: {{ cli_packages | join(', ') }}

      Cargo packages requested: {{ cargo_tools | list | join(', ') }}
      Source builds are disabled. See any binary installation warnings above.
      {% endif %}

      Verified tools:
      {% for result in cli_tool_versions.results %}
      {% if result.rc == 0 %}
      ✓ {{ result.item }}
      {% else %}
      ⚠ {{ result.item }} not available
      {% endif %}
      {% endfor %}
