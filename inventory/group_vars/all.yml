---
# Shared defaults for all inventory-managed machines.
ansible_python_interpreter: /usr/bin/python3

# Explicit connection user so plays don't depend on SSH config alone.
# (ansible_user is otherwise often unset when User comes only from ~/.ssh/config.)
ansible_user: stonecharioteer
dev_user: stonecharioteer
dev_home: "/home/{{ dev_user }}"

enable_github_preflight: true
enable_failsafe_checks: true
enable_shell_environment: true
enable_development_tools: true
enable_docker: true
enable_hugo: true
enable_tailscale: false
enable_laptop_health_monitoring: false
enable_laptop_lid_ignore: false
enable_laptop_panic_reboot: false
enable_nvme_health_monitoring: true
enable_battery_charge_thresholds: false
enable_headless_health_monitor: false
enable_ssh_long_lived: false
enable_x13_screen_keepoff: false
enable_lightdm_display_sleep: false
enable_nvidia_integrated_mode: false
enable_nouveau_blacklist_fix: false
