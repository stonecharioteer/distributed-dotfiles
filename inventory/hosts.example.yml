---
# Example home inventory using SSH config/FQDN hostnames.
# Copy to inventory/hosts.yml (gitignored) and replace placeholders.
# Keep this file focused on host membership. Put shared behavior in
# inventory/group_vars/ and per-machine exceptions in inventory/host_vars/.

all:
  children:
    # Use with playbooks/base-environment.yml.
    headless_machines:
      hosts:
        linux-server.home.local:  # Example headless server
        thinkpad-server.home.local:  # Example headless ThinkPad

    # Use with playbooks/gui-environment.yml.
    gui_machines:
      hosts:
        desktop.home.local:
        linux-laptop.home.local:
        mini-pc.home.local:

    # Use with playbooks/macos-base-environment.yml or macos-gui-environment.yml.
    # macOS playbooks usually run against inventory/localhost.yml; add real
    # MacBook hosts here only if you want to manage them from another machine.
    macbooks:
      hosts: {}

    # Group by OS profile.
    ubuntu_server_lts:
      hosts:
        linux-server.home.local:
        thinkpad-server.home.local:

    # Ubuntu LTS 26.04 switched these hosts to sudo-rs.
    ubuntu_lts_26_04:
      hosts:
        linux-server.home.local:
        thinkpad-server.home.local:

    sudo_rs:
      hosts:
        linux-server.home.local:
        thinkpad-server.home.local:

    linux_mint_22_1:
      hosts:
        linux-laptop.home.local:

    # Group by purpose.
    development_machines:
      children:
        headless_machines:
        gui_machines:
        macbooks:

    linux:
      children:
        headless_machines:
        gui_machines:

    servers:
      hosts:
        linux-server.home.local:
        thinkpad-server.home.local:

    workstations:
      hosts:
        desktop.home.local:
        linux-laptop.home.local:
        mini-pc.home.local:

    # Optional tooling groups. Add hosts here only when they need the role.
    supabase_machines:
      hosts: {}

    # Group by hardware/device type.
    thinkpads:
      hosts:
        thinkpad-server.home.local:

    linux_laptops:
      hosts:
        linux-laptop.home.local:
        thinkpad-server.home.local:

    laptops:
      hosts:
        linux-laptop.home.local:
        thinkpad-server.home.local:

    mini_pcs:
      hosts:
        mini-pc.home.local:

    desktops:
      hosts:
        desktop.home.local:
