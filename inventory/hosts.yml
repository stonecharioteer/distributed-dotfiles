---
# Home Computer Inventory using SSH config hostnames
# Uses hostnames from ~/.ssh/config - much cleaner!

all:
  vars:
    # Ansible will use SSH config for connection details
    ansible_python_interpreter: /usr/bin/python3

  children:
    workstations:
      hosts:
        desktop:
          # ansible_connection: local  # Uncomment if running from this machine
        x13-flow:       # ASUS Flow X13 laptop
        hp-pavilion:    # HP Pavilion laptop
        EQR5:          # Mini PC

    servers:
      hosts:
        storage:       # Storage server
        t14-g2-01.home.arpa:  # Headless ThinkPad T14 Gen 2, Ubuntu Server LTS
        t14-g2-02.home.arpa:  # Headless ThinkPad T14 Gen 2, Ubuntu Server LTS

    # Group by function
    gui_machines:
      hosts:
        desktop:
        x13-flow:
        hp-pavilion:
        EQR5:

    headless_machines:
      hosts:
        storage:
        t14-g2-01.home.arpa:
        t14-g2-02.home.arpa:

    supabase_machines:
      hosts: {}

    # Group by OS profile
    ubuntu_server_lts:
      hosts:
        t14-g2-01.home.arpa:
        t14-g2-02.home.arpa:

    # Group by device type
    laptops:
      hosts:
        x13-flow:
        hp-pavilion:
        t14-g2-01.home.arpa:
        t14-g2-02.home.arpa:

    mini_pcs:
      hosts:
        EQR5:

    desktops:
      hosts:
        desktop:
