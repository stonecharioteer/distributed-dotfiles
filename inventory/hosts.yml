---
# Home inventory using SSH config/FQDN hostnames.
# Keep this file focused on host membership. Put shared behavior in
# inventory/group_vars/ and per-machine exceptions in inventory/host_vars/.

all:
  children:
    # Use with playbooks/base-environment.yml.
    headless_machines:
      hosts:
        storage:  # Storage server
        t14-g2-01.home.arpa:  # Headless ThinkPad T14 Gen 2, Ubuntu LTS 26.04
        t14-g2-02.home.arpa:  # Headless ThinkPad T14 Gen 2, Ubuntu LTS 26.04

    # Use with playbooks/gui-environment.yml.
    gui_machines:
      hosts:
        desktop:
        x13-flow.home.arpa:  # ASUS Flow X13 laptop
        hp-pavilion:  # HP Pavilion laptop
        EQR5:  # Mini PC

    # Use with playbooks/macos-base-environment.yml or macos-gui-environment.yml.
    # macOS playbooks usually run against inventory/localhost.yml; add real
    # MacBook hosts here only if you want to manage them from another machine.
    macbooks:
      hosts: {}

    # Group by OS profile.
    ubuntu_server_lts:
      hosts:
        t14-g2-01.home.arpa:
        t14-g2-02.home.arpa:

    # Ubuntu LTS 26.04 switched these hosts to sudo-rs.
    ubuntu_lts_26_04:
      hosts:
        t14-g2-01.home.arpa:
        t14-g2-02.home.arpa:

    sudo_rs:
      hosts:
        t14-g2-01.home.arpa:
        t14-g2-02.home.arpa:

    # Group by purpose.
    development_machines:
      children:
        headless_machines:
        gui_machines:
        macbooks:

    linux:
      children:
        headless_machines:
        gui_machines:

    servers:
      hosts:
        storage:
        t14-g2-01.home.arpa:
        t14-g2-02.home.arpa:

    workstations:
      hosts:
        desktop:
        x13-flow.home.arpa:
        hp-pavilion:
        EQR5:

    # Optional tooling groups. Add hosts here only when they need the role.
    supabase_machines:
      hosts: {}

    # Group by hardware/device type.
    thinkpads:
      hosts:
        t14-g2-01.home.arpa:
        t14-g2-02.home.arpa:

    linux_laptops:
      hosts:
        x13-flow.home.arpa:
        t14-g2-01.home.arpa:
        t14-g2-02.home.arpa:

    laptops:
      hosts:
        x13-flow.home.arpa:
        hp-pavilion:
        t14-g2-01.home.arpa:
        t14-g2-02.home.arpa:

    mini_pcs:
      hosts:
        EQR5:

    desktops:
      hosts:
        desktop:
