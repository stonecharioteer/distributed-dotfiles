---
name: quality checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  commit-messages:
    name: commit messages
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pre-commit
        run: python -m pip install pre-commit

      - name: Check commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          IS_PR: ${{ github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail

          if [[ "${IS_PR}" == "true" ]]; then
            mapfile -t commits < <(git rev-list "${BASE_SHA}..${HEAD_SHA}")
          else
            commits=("${HEAD_SHA}")
          fi

          for commit_sha in "${commits[@]}"; do
            message_file="${RUNNER_TEMP}/commit-message-${commit_sha}"
            git log -1 --format=%B "${commit_sha}" > "${message_file}"
            pre-commit run block-ai-commit-attribution \
              --hook-stage commit-msg \
              --commit-msg-filename "${message_file}"
            pre-commit run check-conventional-commit \
              --hook-stage commit-msg \
              --commit-msg-filename "${message_file}"
          done

  file-hygiene:
    name: file hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pre-commit
        run: python -m pip install pre-commit

      - name: Run file hygiene hooks
        run: |
          pre-commit run check-added-large-files --all-files
          pre-commit run check-case-conflict --all-files
          pre-commit run check-merge-conflict --all-files
          pre-commit run detect-private-key --all-files
          pre-commit run end-of-file-fixer --all-files --show-diff-on-failure
          pre-commit run mixed-line-ending --all-files --show-diff-on-failure
          pre-commit run trailing-whitespace --all-files --show-diff-on-failure

  yaml:
    name: yaml
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pre-commit
        run: python -m pip install pre-commit

      - name: Run YAML checks
        run: |
          pre-commit run check-yaml --all-files
          pre-commit run yamllint --all-files

  ansible:
    name: ansible-lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pre-commit
        run: python -m pip install pre-commit

      - name: Run Ansible lint
        run: |
          pre-commit run ansible-lint --all-files
          pre-commit run check-ansible-risky-patterns --all-files

  shell:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pre-commit
        run: python -m pip install pre-commit

      - name: Run shellcheck
        run: pre-commit run shellcheck --all-files
