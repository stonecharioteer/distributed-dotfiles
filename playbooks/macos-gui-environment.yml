---
# Complete macOS GUI workstation setup playbook
# Includes base development environment + GUI applications
- name: Complete macOS GUI Workstation Setup
  hosts: all
  gather_facts: true
  vars:
    dev_user: "{{ ansible_user | default(lookup('env', 'USER')) }}"
    dev_home: "{{ ansible_facts.env.HOME | default('/Users/' + dev_user) }}"
    enable_shell_environment: true
    enable_development_tools: true
    enable_docker: true
    enable_gui_environment: true
    enable_nerd_fonts: true
    enable_ghostty: true
    enable_aerospace: true

  pre_tasks:
    - name: Verify running on macOS
      assert:
        that:
          - ansible_facts["os_family"] == "Darwin"
        fail_msg: "This playbook is designed for macOS only"
        success_msg: "✓ Running on macOS {{ ansible_facts['distribution_version'] }}"

    - name: Verify pbcopy is available (built-in on macOS)
      command: which pbcopy
      register: pbcopy_check
      changed_when: false
      failed_when: false

    - name: Display pbcopy status
      debug:
        msg: |
          {% if pbcopy_check.rc == 0 %}
          ✓ pbcopy available at {{ pbcopy_check.stdout }}
          {% else %}
          ⚠ pbcopy not found (should be built-in on macOS)
          {% endif %}

    - name: Check if Homebrew is installed
      stat:
        path: /opt/homebrew/bin/brew
      register: homebrew_check
      become: no

    - name: Display Homebrew status
      debug:
        msg: |
          {% if homebrew_check.stat.exists %}
          ✓ Homebrew is already installed
          {% else %}
          → Homebrew will be installed by roles
          {% endif %}

  roles:
    # Base Development Environment (shell + dev tools)
    - role: fish-shell
      when: enable_shell_environment | bool
      tags: [shell, fish]
    - role: fish-repository-setup
      when: enable_shell_environment | bool
      tags: [shell, fish, dotfiles]
    - role: scripts-repository-setup
      when: enable_shell_environment | bool
      tags: [shell, scripts]
    - role: mise-tools
      when: enable_shell_environment | bool
      tags: [shell, mise, languages]
    - role: rust-toolchain
      when: enable_shell_environment | bool
      tags: [shell, rust, languages]
    - role: fish-config
      when: enable_shell_environment | bool
      tags: [shell, fish, config]
    - role: git-config
      when: enable_development_tools | bool
      tags: [dev, git, config]
    - role: cli-tools
      when: enable_development_tools | bool
      tags: [dev, cli]
    - role: starship-config
      when: enable_shell_environment | bool
      tags: [shell, starship, config]
    - role: dev-folders
      when: enable_development_tools | bool
      tags: [dev, folders]
    - role: tmux
      when: enable_development_tools | bool
      tags: [dev, tmux]
    - role: neovim-latest
      when: enable_development_tools | bool
      tags: [dev, neovim, editor]
    - role: tree-sitter-cli
      when: enable_development_tools | bool
      tags: [dev, neovim]
    - role: nvim-config
      when: enable_development_tools | bool
      tags: [dev, neovim, editor, config]
    - role: docker
      when: enable_docker | bool
      tags: [dev, docker, containers]

    # macOS GUI Environment
    - role: nerd-fonts
      when: enable_gui_environment | bool and enable_nerd_fonts | bool
      tags: [gui, fonts]
    - role: ghostty
      when: enable_gui_environment | bool and enable_ghostty | bool
      tags: [gui, terminal, ghostty]
    - role: aerospace-wm
      when: enable_gui_environment | bool and enable_aerospace | bool
      tags: [gui, wm, aerospace]

  post_tasks:
    - name: Display complete GUI workstation setup completion
      debug:
        msg: |
          🚀 Complete macOS GUI Workstation Setup Finished!

          Profile: macOS GUI workstation
          Feature flags:
          - Shell environment: {{ enable_shell_environment }}
          - Development tools: {{ enable_development_tools }}
          - Docker: {{ enable_docker }}
          - GUI environment: {{ enable_gui_environment }}
          - Nerd Fonts: {{ enable_nerd_fonts }}
          - Ghostty: {{ enable_ghostty }}
          - AeroSpace: {{ enable_aerospace }}

          ⚠️  IMPORTANT: Some tasks required sudo access:
          - Adding Fish to /etc/shells
          - Setting Fish as default shell
          You may have been prompted for your password during installation.

          🐚 Shell Environment:
          ✓ Homebrew package manager
          ✓ Fish shell with syntax highlighting and modern features
          ✓ Fish dotfiles cloned from: git@github.com:stonecharioteer/dotfiles-fish.git
          ✓ Personal scripts repository cloned from: git@github.com:stonecharioteer/scripts.git
          ✓ mise runtime manager (Node.js, Python, Go, Rust)
          ✓ Enhanced Rust toolchain with cargo-binstall
          ✓ Fish configuration with abbreviations and integrations

          🛠️ Development Environment:
          ✓ Modern CLI tools (ripgrep, fd, fzf, starship, gum, etc.)
          ✓ Database tools (PostgreSQL client, pgcli)
          ✓ Development folder structure
          ✓ tmux via Homebrew
          ✓ Neovim via Homebrew with vim symlink
          ✓ tree-sitter CLI for syntax highlighting
          ✓ Custom Neovim configuration from git@github.com:stonecharioteer/nvim-config.git
          ✓ Docker Desktop installed

          🖥️ macOS GUI Environment:
          ✓ JetBrains Mono Nerd Font with icon support
          ✓ Ghostty terminal emulator (GPU-accelerated, native macOS)
          ✓ AeroSpace tiling window manager

          📋 Next Steps:
          1. Restart your terminal or run: exec fish
          2. Launch Docker Desktop from Applications
          3. Launch AeroSpace from Applications (grant Accessibility permissions)
          4. Launch Ghostty terminal emulator
          5. Test complete environment:
             - tmux new-session -d -s test
             - docker run hello-world (after launching Docker Desktop)
             - nvim (complete plugin setup)
             - mise list (verify language runtimes)
             - psql --version && pgcli --version (database tools)

          🎯 Your complete macOS GUI workstation is ready!
          - Modern shell: Fish with mise for language management
          - Development tools: tmux, Neovim, Docker
          - GUI applications: Ghostty terminal, AeroSpace window manager
          - All tools integrated and configured for maximum productivity

          💡 AeroSpace Keyboard Shortcuts:
          - Alt+h/j/k/l: Navigate between windows
          - Alt+1-9: Switch workspaces
          - Alt+Shift+1-9: Move windows to workspaces
          - Alt+r: Resize mode
          - Customize at: ~/.config/aerospace/aerospace.toml
