---
# Complete GUI workstation setup playbook
# Includes base development environment + GUI components
- name: Complete GUI Workstation Setup
  hosts: all
  become: yes
  gather_facts: true
  vars:
    # dev_user/dev_home come from inventory/group_vars (all.yml).
    # Do not re-derive dev_user from ansible_user here; it is often unset when
    # SSH User is provided only via ~/.ssh/config.
    run_gui_failsafe_checks: true
    enable_github_preflight: true
    enable_failsafe_checks: true
    enable_shell_environment: true
    enable_development_tools: true
    enable_docker: true
    enable_gui_environment: true
    enable_qtile: true
    enable_nerd_fonts: true
    enable_alacritty: true
    enable_desktop_integration: true
    # tailscale/laptop flags come from inventory group_vars (e.g. laptops.yml).

  pre_tasks:
    - name: Update package cache (Debian/Ubuntu)
      apt:
        update_cache: yes
        cache_valid_time: 86400
      when: ansible_facts["os_family"] == "Debian"

    - name: Install GitHub CLI and verify authentication
      include_tasks:
        file: tasks/github-cli-preflight.yml
        apply:
          tags: [github, github-preflight, shell, fish, dotfiles, scripts, dev, neovim, editor, config, gui, system, repos]
      tags: [github, github-preflight, shell, fish, dotfiles, scripts, dev, neovim, editor, config, gui, system, repos]
      when: enable_github_preflight | bool

    - name: Check which packages are missing
      shell: dpkg -l {{ item }} 2>/dev/null | grep -q '^ii' || echo "{{ item }}"
      register: missing_packages_check
      loop:
        - curl
        - wget
        - git
        - unzip
        - tar
        - gzip
        - software-properties-common
        - apt-transport-https
        - ca-certificates
        - gnupg
        - lsb-release
        - gh
        - python3-dev
        - python3-pip
        - python3-venv
        - build-essential
        - htop
        - tree
        - rsync
      changed_when: false
      failed_when: false
      when: ansible_facts["os_family"] == "Debian"

    - name: Create list of packages to install
      set_fact:
        packages_to_install: "{{ missing_packages_check.results | selectattr('stdout', 'defined') | selectattr('stdout', '!=', '') | map(attribute='stdout') | list }}"
      when: ansible_facts["os_family"] == "Debian"

    - name: Install missing system packages for GUI workstation
      apt:
        name: "{{ packages_to_install }}"
        state: present
        install_recommends: no
        force_apt_get: yes
      when:
        - ansible_facts["os_family"] == "Debian"
        - packages_to_install is defined
        - packages_to_install | length > 0

  roles:
    # Failsafe checks for all components
    - role: failsafe-checks
      when: enable_failsafe_checks | bool
      tags: [safety, shell, fish, dotfiles, scripts, gui, system, repos]

    # Base Development Environment (shell + dev tools)
    - role: fish-shell
      when: enable_shell_environment | bool
      tags: [shell, fish]
    - role: fish-repository-setup
      when: enable_shell_environment | bool
      tags: [shell, fish, dotfiles]
    - role: scripts-repository-setup
      when: enable_shell_environment | bool
      tags: [shell, scripts]
    - role: mise-tools
      when: enable_shell_environment | bool
      tags: [shell, mise, languages]
    - role: rust-toolchain
      when: enable_shell_environment | bool
      tags: [shell, rust, languages]
    - role: fish-config
      when: enable_shell_environment | bool
      tags: [shell, fish, config]
    - role: system-deps
      when: enable_development_tools | bool
      tags: [dev, deps]
    - role: git-config
      when: enable_development_tools | bool
      tags: [dev, git, config]
    - role: cli-tools
      when: enable_development_tools | bool
      tags: [dev, cli]
    - role: starship-config
      when: enable_shell_environment | bool
      tags: [shell, starship, config]
    - role: dev-folders
      when: enable_development_tools | bool
      tags: [dev, folders]
    - role: tmux
      when: enable_development_tools | bool
      tags: [dev, tmux]
    - role: neovim-latest
      when: enable_development_tools | bool
      tags: [dev, neovim, editor]
    - role: tree-sitter-cli
      when: enable_development_tools | bool
      tags: [dev, neovim]
    - role: nvim-config
      when: enable_development_tools | bool
      tags: [dev, neovim, editor, config]
    - role: docker
      when: enable_docker | bool
      tags: [dev, docker, containers]
    - role: tailscale
      when: enable_tailscale | bool
      tags: [networking, tailscale]
    - role: laptop-health
      when: >-
        enable_laptop_health_monitoring | bool
        or enable_laptop_lid_ignore | default(false) | bool
        or enable_battery_charge_thresholds | default(false) | bool
        or enable_headless_health_monitor | default(false) | bool
        or enable_ssh_long_lived | default(false) | bool
        or enable_x13_screen_keepoff | default(false) | bool
      tags: [laptop, health, monitoring]

    # GUI Environment
    - role: locale-setup
      when: enable_gui_environment | bool
      tags: [gui, system, locale]
    - role: base-system
      when: enable_gui_environment | bool
      tags: [gui, system]
    - role: repository-setup
      when: enable_gui_environment | bool
      tags: [gui, system, repos]
    - role: qtile-wm
      when: enable_gui_environment | bool and enable_qtile | bool
      tags: [gui, wm, qtile]
    - role: nerd-fonts
      when: enable_gui_environment | bool and enable_nerd_fonts | bool
      tags: [gui, fonts]
    - role: alacritty
      when: enable_gui_environment | bool and enable_alacritty | bool
      tags: [gui, terminal, alacritty]
    - role: desktop-integration
      when: enable_gui_environment | bool and enable_desktop_integration | bool
      tags: [gui, desktop, integration]

  post_tasks:
    - name: Display complete GUI workstation setup completion
      debug:
        msg: |
          🚀 Complete GUI Workstation Setup Finished!

          Profile: Linux GUI workstation
          Feature flags:
          - Shell environment: {{ enable_shell_environment }}
          - Development tools: {{ enable_development_tools }}
          - Docker: {{ enable_docker }}
          - GUI environment: {{ enable_gui_environment }}
          - Qtile: {{ enable_qtile }}
          - Nerd Fonts: {{ enable_nerd_fonts }}
          - Alacritty: {{ enable_alacritty }}
          - Tailscale: {{ enable_tailscale }}
          - Laptop health monitoring: {{ enable_laptop_health_monitoring }}

          🐚 Shell Environment:
          ✓ Fish shell with syntax highlighting and modern features
          ✓ Fish dotfiles cloned from: git@github.com:stonecharioteer/dotfiles-fish.git
          ✓ Personal scripts repository cloned from: git@github.com:stonecharioteer/scripts.git
          ✓ mise runtime manager (Node.js, Python, Go, Rust)
          ✓ Enhanced Rust toolchain with cargo-binstall
          ✓ Fish configuration with abbreviations and integrations

          🛠️ Development Environment:
          ✓ System dependencies and development headers
          ✓ Modern CLI tools (ripgrep, fd, fzf, starship, etc.)
          ✓ Development folder structure
          ✓ tmux compiled from latest source
          ✓ Neovim {{ neovim_version | default('latest') }} with vim symlink
          ✓ tree-sitter CLI for syntax highlighting
          ✓ Custom Neovim configuration from git@github.com:stonecharioteer/nvim-config.git
          ✓ Docker Engine with Compose plugin
          {% if enable_tailscale | bool %}✓ Tailscale installed for tailnet access{% endif %}

          🖥️ GUI Environment:
          ✓ System locale and base packages
          ✓ Qtile dotfiles cloned from: git@github.com:stonecharioteer/dotfiles-qtile.git
          ✓ Qtile window manager with Python configuration
          ✓ JetBrains Mono Nerd Font with icon support
          ✓ Alacritty GPU-accelerated terminal
          ✓ Desktop integration and session management

          📋 Next Steps:
          1. Log out and log back in for shell/group changes
          2. Select "Qtile" from display manager login screen
          3. Log in with your user account
          4. Test complete environment:
             - tmux new-session -d -s test
             - docker run hello-world
             - nvim (complete plugin setup)
             - mise list (verify language runtimes)

          🎯 Your complete GUI workstation is ready!
          - Modern shell: Fish with mise for language management
          - Development tools: tmux, Neovim/AstroNvim, Docker
          - GUI desktop: Qtile window manager with Alacritty terminal
          - All tools integrated and configured for maximum productivity
